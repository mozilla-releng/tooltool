---
transforms:
    - taskgraph.transforms.matrix
    - tooltool_taskgraph.transforms.codecov


task-defaults:
  worker-type: test
  worker:
    max-run-time: 1800
  run:
    using: run-task
    checkout:
      tooltool: {}
    cwd: '{{checkout}}'

tasks-from:
  - api.yml
  - client.yml
